name: CD Pipeline

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: crash-prediction-api
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.ref_name }} .

      - name: Push to GHCR
        run: |
          docker push $REGISTRY/${{ github.repository_owner }}/$IMAGE_NAME:${{ github.ref_name }}

      - name: Configure SSH for remote deploy
        if: ${{ env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy to remote Docker host
        if: ${{ env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' }}
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/crash-prediction-api}"
          ssh -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "
            set -e
            cd ${DEPLOY_PATH}
            export IMAGE_TAG='${IMAGE_TAG}'
            export IMAGE_REF='${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}'
            export IMAGE_NAME='${{ env.IMAGE_NAME }}'
            export REGISTRY='${{ env.REGISTRY }}'
            docker compose pull
            docker compose up -d --remove-orphans
          "
