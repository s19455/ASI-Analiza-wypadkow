name: Continuous Training

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zaleznosci
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run Kedro pipeline
        run: kedro run

      - name: Run drift monitoring
        run: python scripts/run_drift_monitoring.py

      - name: Validate model
        run: python scripts/validate_model.py

      - name: Upload drift artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-report-${{ github.run_number }}
          path: |
            data/08_reporting/drift_report.html
            data/08_reporting/drift_summary.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: data/06_models/model.pkl
